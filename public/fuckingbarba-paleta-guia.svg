<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">FuckingBarba — paleta e aplicação para a Black Friday</title><desc id="desc">Seis cores com HEX e RGB, proporção sugerida e aplicações em pré-Black, Black e vídeo.</desc><rect width="1600" height="1120" fill="#f2f3f4"/><rect width="1600" height="185" fill="#12181f"/><g font-family="Arial, Helvetica, sans-serif"><text x="62" y="58" fill="#ffd84d" font-size="17" font-weight="700" letter-spacing="3">FUCKINGBARBA / DIREÇÃO VISUAL</text><text x="62" y="117" fill="#fff" font-size="43" font-weight="800">As cores da marca. A presença da Black.</text><text x="62" y="155" fill="#d7e0e6" font-size="18">Guia de campanha · Preto e branco na base. Amarelo em destaque. Menta e ciano como apoio.</text><rect x="62" y="222" width="231" height="225" rx="8" fill="#fff" stroke="#cfd5dc"/><path d="M70 222 H285 Q293 222 293 230 V319 H62 V230 Q62 222 70 222" fill="#000000"/><text x="79" y="256" fill="#fff" font-size="13" font-weight="700">BASE</text><text x="79" y="350" fill="#12181f" font-size="21" font-weight="700">Preto</text><text x="79" y="382" fill="#12181f" font-size="21" font-weight="700">#000000</text><text x="79" y="413" fill="#566072" font-size="16">RGB 0, 0, 0</text><rect x="311" y="222" width="231" height="225" rx="8" fill="#fff" stroke="#cfd5dc"/><path d="M319 222 H534 Q542 222 542 230 V319 H311 V230 Q311 222 319 222" fill="#12181F"/><text x="328" y="256" fill="#fff" font-size="13" font-weight="700">APOIO</text><text x="328" y="350" fill="#12181f" font-size="21" font-weight="700">Grafite</text><text x="328" y="382" fill="#12181f" font-size="21" font-weight="700">#12181F</text><text x="328" y="413" fill="#566072" font-size="16">RGB 18, 24, 31</text><rect x="560" y="222" width="231" height="225" rx="8" fill="#fff" stroke="#cfd5dc"/><path d="M568 222 H783 Q791 222 791 230 V319 H560 V230 Q560 222 568 222" fill="#FFFFFF"/><text x="577" y="256" fill="#12181f" font-size="13" font-weight="700">LEITURA</text><text x="577" y="350" fill="#12181f" font-size="21" font-weight="700">Branco</text><text x="577" y="382" fill="#12181f" font-size="21" font-weight="700">#FFFFFF</text><text x="577" y="413" fill="#566072" font-size="16">RGB 255, 255, 255</text><rect x="809" y="222" width="231" height="225" rx="8" fill="#fff" stroke="#cfd5dc"/><path d="M817 222 H1032 Q1040 222 1040 230 V319 H809 V230 Q809 222 817 222" fill="#FFD84D"/><text x="826" y="256" fill="#12181f" font-size="13" font-weight="700">DESTAQUE</text><text x="826" y="350" fill="#12181f" font-size="21" font-weight="700">Amarelo</text><text x="826" y="382" fill="#12181f" font-size="21" font-weight="700">#FFD84D</text><text x="826" y="413" fill="#566072" font-size="16">RGB 255, 216, 77</text><rect x="1058" y="222" width="231" height="225" rx="8" fill="#fff" stroke="#cfd5dc"/><path d="M1066 222 H1281 Q1289 222 1289 230 V319 H1058 V230 Q1058 222 1066 222" fill="#4FE4B6"/><text x="1075" y="256" fill="#12181f" font-size="13" font-weight="700">MARCA</text><text x="1075" y="350" fill="#12181f" font-size="21" font-weight="700">Menta</text><text x="1075" y="382" fill="#12181f" font-size="21" font-weight="700">#4FE4B6</text><text x="1075" y="413" fill="#566072" font-size="16">RGB 79, 228, 182</text><rect x="1307" y="222" width="231" height="225" rx="8" fill="#fff" stroke="#cfd5dc"/><path d="M1315 222 H1530 Q1538 222 1538 230 V319 H1307 V230 Q1307 222 1315 222" fill="#22D3EE"/><text x="1324" y="256" fill="#12181f" font-size="13" font-weight="700">CAMPANHA</text><text x="1324" y="350" fill="#12181f" font-size="21" font-weight="700">Ciano</text><text x="1324" y="382" fill="#12181f" font-size="21" font-weight="700">#22D3EE</text><text x="1324" y="413" fill="#566072" font-size="16">RGB 34, 211, 238</text><text x="62" y="486" fill="#566072" font-size="15">Base: site oficial consultado em 12/10/2026. Ciano: extensão proposta para a captação; não é uma cor oficial confirmada.</text><rect x="62" y="514" width="886" height="21" fill="#12181f"/><rect x="948" y="514" width="369" height="21" fill="#fff" stroke="#cfd5dc"/><rect x="1317" y="514" width="148" height="21" fill="#ffd84d"/><rect x="1465" y="514" width="74" height="21" fill="#4fe4b6"/><text x="62" y="569" fill="#12181f" font-size="20" font-weight="700">60% escuros + 25% branco + 10% amarelo + 5% menta ou ciano</text><text x="62" y="599" fill="#566072" font-size="15">Proporção visual sugerida para a peça; não representa potência de iluminação. Ajuste à foto e ao formato.</text><rect x="62" y="640" width="476" height="227" rx="8" fill="#fff" stroke="#cfd5dc"/><rect x="62" y="640" width="476" height="5" fill="#ffd84d"/><text x="83" y="681" fill="#566072" font-size="14" font-weight="700">PRÉ-BLACK</text><text x="83" y="719" fill="#12181f" font-size="24" font-weight="700">Expectativa + acesso</text><text x="83" y="761" fill="#566072" font-size="16">Fundo preto, título branco e destaque amarelo.</text><text x="83" y="789" fill="#566072" font-size="16">Kit com as cores originais e detalhe menta.</text><text x="83" y="817" fill="#566072" font-size="16">“Saiba mais e garanta seu acesso”. Sem preço.</text><rect x="564" y="640" width="476" height="227" rx="8" fill="#fff" stroke="#cfd5dc"/><rect x="564" y="640" width="476" height="5" fill="#4fe4b6"/><text x="585" y="681" fill="#566072" font-size="14" font-weight="700">BLACK ABERTA</text><text x="585" y="719" fill="#12181f" font-size="24" font-weight="700">Condição + compra</text><text x="585" y="761" fill="#566072" font-size="16">Fundo preto ou amarelo; CTA com contraste.</text><text x="585" y="789" fill="#566072" font-size="16">Produto e condição aprovada em destaque.</text><text x="585" y="817" fill="#566072" font-size="16">Preço, desconto e prazo só após a abertura.</text><rect x="1066" y="640" width="476" height="227" rx="8" fill="#fff" stroke="#cfd5dc"/><rect x="1066" y="640" width="476" height="5" fill="#22d3ee"/><text x="1087" y="681" fill="#566072" font-size="14" font-weight="700">CAPTAÇÃO E EDIÇÃO</text><text x="1087" y="719" fill="#12181f" font-size="24" font-weight="700">Pele natural + contraste</text><text x="1087" y="761" fill="#566072" font-size="16">Fundo grafite; luz branca no rosto e produto.</text><text x="1087" y="789" fill="#566072" font-size="16">Amarelo e ciano no fundo, em baixa intensidade.</text><text x="1087" y="817" fill="#566072" font-size="16">Legendas brancas com apoio escuro quando preciso.</text><rect x="62" y="902" width="476" height="61" rx="5" fill="#12181f"/><text x="84" y="939" fill="#fff" font-size="19" font-weight="700">Branco sobre grafite · 17,9:1</text><rect x="564" y="902" width="476" height="61" rx="5" fill="#ffd84d"/><text x="586" y="939" fill="#12181f" font-size="19" font-weight="700">Grafite sobre amarelo · 12,9:1</text><rect x="1066" y="902" width="476" height="61" rx="5" fill="#4fe4b6"/><text x="1088" y="939" fill="#12181f" font-size="19" font-weight="700">Grafite sobre menta · 11,1:1</text><text x="62" y="1003" fill="#566072" font-size="16">Evite branco sobre amarelo, menta ou ciano em textos pequenos. Preserve o logo original e as cores dos rótulos.</text><text x="62" y="1034" fill="#566072" font-size="16">HEX/RGB para digital. No set, ajuste pela câmera; para impressão, converta com o perfil da gráfica.</text><text x="62" y="1080" fill="#566072" font-size="14">Referência: www.fuckingbarba.com.br · Direção adaptável de campanha; não substitui o manual oficial da marca.</text></g></svg>